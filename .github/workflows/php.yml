name: PHP Composer

on:
  push:
    branches: [ "*.x" ]
  pull_request:
    branches: [ "*.x" ]

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [ '8.3', '8.4' ]

    steps:
    - uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: curl
        coverage: none

    - name: Validate composer.json
      run: composer validate --strict

    - name: Get Composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    # composer.lock is not committed, so it cannot be part of the cache key:
    # hashFiles() over a missing file returns an empty string, which pins the
    # key to a constant and stops the cache from ever invalidating. Cache the
    # Composer download cache keyed on composer.json instead of vendor/, since
    # vendor/ contents depend on which versions the resolver picked.
    - name: Cache Composer downloads
      uses: actions/cache@v6
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
        restore-keys: |
          ${{ runner.os }}-composer-${{ matrix.php }}-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run test suite
      run: composer run-script test
